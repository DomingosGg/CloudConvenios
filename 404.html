<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #1d1934; background: #f5f5f8; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { max-width: 560px; background: #fff; border-radius: 18px; padding: 36px; box-shadow: 0 18px 55px rgba(29,25,52,.14); }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { line-height: 1.55; color: #55536a; }
    a { display: inline-block; margin-top: 14px; padding: 12px 18px; border-radius: 10px; background: #ffc629; color: #1d1934; text-decoration: none; font-weight: 700; }
    code { background: #f0eff5; padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>Erro 404</h1>
    <p>Esta página ou rota não foi encontrada.</p>
    <p>Para acessar o sistema, volte ao endereço principal. Para diagnóstico técnico, use <code>/api/health</code>.</p>
    <a href="/">Voltar ao sistema</a>
  </main>
</body>
</html>
